[project]
name = "filinglens"
version = "0.1.0"
description = "A verifiable analyst copilot for SEC filings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.0.0",
    "fastembed>=0.9.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "pymupdf>=2.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filinglens"]
