[project]
name = "filinglens"
version = "0.1.0"
description = "A verifiable analyst copilot for SEC filings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.0.0",
    "fastapi>=0.162.2",
    "fastembed>=0.9.1",
    "numpy>=2.5.4",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.1",
    "pymupdf>=2.1",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
bakeoff = [
    "docling>=2.148.0",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filinglens"]
